name: Test

on:
  schedule:
    # Runs "At 04:00 every night"
    - cron: '0 4 * * *'

  pull_request:

  workflow_dispatch:
    inputs:
      branch:
        description: 'Dependencies branch (optional)'
        required: false
        type: string
      sdk:
        description: 'SDK that was just released, e.g. stream-chat-swift (optional, requires version)'
        required: false
        type: string
      version:
        description: 'Exact released version of the sdk; other SDKs resolve to their latest release (optional, requires sdk)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  integration:
    name: Integration
    strategy:
      matrix:
        include:
          - project: 'TestFrameworks'
            runner: 'macos-27'
          - project: 'TestStreamChat'
            runner: 'macos-27'
          - project: 'TestStreamChatAI'
            runner: 'macos-27'
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XCODE_VERSION: '27.1'
    steps:
    - uses: actions/checkout@v4.1.1
    - uses: ./.github/actions/ruby-cache
    - name: Switch dependencies branch
      if: inputs.branch != ''
      run: bundle exec fastlane switch_chat_spm_branch branch:"${{ inputs.branch }}" project:"${{ matrix.project }}"
    - name: Pin dependencies to release versions
      if: inputs.version != ''
      run: bundle exec fastlane switch_spm_release_versions sdk:"${{ inputs.sdk }}" version:"${{ inputs.version }}" project:"${{ matrix.project }}"
    - name: Test Integration of Stream ${{ matrix.project }}
      run: bundle exec fastlane test project:"${{ matrix.project }}"
      timeout-minutes: 30

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    needs: [integration]
    if: failure()
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "⚠️ The integration testing pipeline failed."
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
